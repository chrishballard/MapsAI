name: Security Review

# Claude reviews every PR's diff for vulnerabilities and leaves inline comments
# on what it finds. https://github.com/anthropics/claude-code-security-review
#
# Needs the repo secret ANTHROPIC_API_KEY (a Console API key, billed per run).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # inline review comments

concurrency:
  # A new push replaces a review still running on the same PR.
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security-review:
    # Same-repo PRs only. A fork PR gets no secrets, and the reviewer is not
    # hardened against prompt injection from untrusted code.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2

      # Pinned to a commit: this action receives the API key.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda # main, 2026-02-11
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-5-5
          comment-pr: true
          # Re-review on every push, so a red check only turns green on a clean
          # review of the latest code, not because a later push skipped the scan.
          run-every-commit: true
          custom-security-scan-instructions: .github/security-review/scan-instructions.txt

      # The action only logs a warning when it finds something or errors out,
      # so on its own the check stays green and a merge-on-green walks past it.
      - name: Fail on findings
        if: always()
        run: |
          f="$GITHUB_WORKSPACE/claudecode-results.json"
          if [ ! -s "$f" ] || ! jq empty "$f" 2>/dev/null; then
            echo "::error::Security review produced no results. See claudecode-error.log in the security-review-results artifact."
            exit 1
          fi
          if jq -e '.error' "$f" >/dev/null; then
            echo "::error::Security review failed: $(jq -r '.error' "$f")"
            exit 1
          fi
          n=$(jq '.findings | length' "$f")
          {
            echo "## Security review: $n finding(s)"
            jq -r '.findings[] | "- **\(.severity // "?")** `\(.file):\(.line)` \(.category // ""): \(.description // "" | gsub("\\s+"; " "))"' "$f"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -gt 0 ]; then
            jq -r '.findings[] | "::error file=\(.file),line=\(.line)::[\(.severity // "?")] \(.description // "" | gsub("%"; "%25") | gsub("\\s+"; " "))"' "$f"
            exit 1
          fi
          echo "No findings."
